name: CI Verify (libra)

on:
  push:
    branches: ["ci/gha-verify"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Clone upstream source
        run: git clone --depth=1 --branch main https://github.com/libra-tools/libra.git source
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev libx11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libegl1 libvulkan-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxcursor-dev libasound2-dev
      - name: Build
        working-directory: source
        run: cargo build --release --locked
      - name: Show artifacts
        working-directory: source
        run: ls -lh target/release/libra
      - uses: actions/upload-artifact@v4
        with:
          name: libra-binary
          path: source/target/release/libra
